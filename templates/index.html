<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if user %}
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-text">오늘의 할 일</span>
      </div>
      <div class="topbar-actions">
        <button type="button" id="theme-toggle" class="icon-btn" title="어두운 모드 전환" aria-label="어두운 모드 전환">
          <svg id="theme-icon-sun" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4.5a1 1 0 0 1-1-1V2a1 1 0 1 1 2 0v1.5a1 1 0 0 1-1 1Zm0 15a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1ZM4.5 12a1 1 0 0 1-1 1H2a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1Zm18 0a1 1 0 0 1-1 1H20a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1ZM6.34 7.76a1 1 0 0 1-1.41 0L3.87 6.7a1 1 0 0 1 1.41-1.41l1.06 1.06a1 1 0 0 1 0 1.41Zm12.02 12.02a1 1 0 0 1-1.41 0l-1.06-1.06a1 1 0 0 1 1.41-1.41l1.06 1.06a1 1 0 0 1 0 1.41ZM6.34 16.24a1 1 0 0 1 0 1.41L5.28 18.7a1 1 0 1 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0Zm12.02-12.02a1 1 0 0 1 0 1.41l-1.06 1.06a1 1 0 1 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>
        </button>
        <div class="user-chip">
          {% if user.picture %}
          <img class="user-avatar" src="{{ user.picture }}" alt="{{ user.name }}">
          {% endif %}
          <span class="user-name">{{ user.name or user.email }}</span>
        </div>
        <a class="text-link" href="{{ url_for('logout') }}">로그아웃</a>
      </div>
    </header>

    <main class="container">
      <section class="stats-card">
        <div class="stats-top">
          <span class="stats-label" id="stats-label">오늘도 하나씩 해봐요</span>
          <span class="stats-fraction" id="stats-fraction">0 / 0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
        </div>
      </section>

      <form id="task-form" class="task-form">
        <input type="text" id="task-input" class="task-input" placeholder="할 일을 입력하세요" autocomplete="off" required>
        <div class="task-form-row">
          <select id="priority-input" class="priority-select" title="우선순위">
            <option value="low">낮음</option>
            <option value="medium" selected>보통</option>
            <option value="high">높음</option>
          </select>
          <input type="date" id="due-date-input" class="date-input" title="마감일">
          <button type="submit" class="add-btn">추가</button>
        </div>
      </form>

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" class="search-icon"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.76 10.66l4.79 4.79a1 1 0 0 0 1.41-1.41l-4.79-4.79A6 6 0 0 0 10 4Zm-4 6a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z"/></svg>
          <input type="text" id="search-input" placeholder="할 일 검색" autocomplete="off">
        </div>
        <div id="filter-bar" class="filter-bar">
          <button type="button" class="filter-btn active" data-filter="all">전체</button>
          <button type="button" class="filter-btn" data-filter="active">진행중</button>
          <button type="button" class="filter-btn" data-filter="done">완료</button>
        </div>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <div class="list-footer">
        <button type="button" id="clear-completed" class="clear-btn" hidden>완료 항목 지우기</button>
        <div id="pagination" class="pagination">
          <button type="button" id="prev-page" class="page-btn">이전</button>
          <span id="page-info" class="page-info">1 / 1</span>
          <button type="button" id="next-page" class="page-btn">다음</button>
        </div>
      </div>
    </main>
  </div>
  {% else %}
  <div class="login-screen">
    <div class="login-card">
      <span class="brand-mark large">◆</span>
      <h1 class="login-title">오늘의 할 일</h1>
      <p class="login-copy">우선순위와 마감일까지, 하루를 정리하는 가장 단순한 방법.</p>
      <a class="google-login-btn" href="{{ url_for('login') }}">
        <svg viewBox="0 0 48 48" width="18" height="18">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.9 5.1 29.7 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.9 5.1 29.7 3 24 3c-7.6 0-14.2 4.3-17.7 10.7z"/>
          <path fill="#4CAF50" d="M24 45c5.6 0 10.7-1.9 14.6-5.2l-6.7-5.6c-2 1.5-4.7 2.5-7.9 2.5-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.7 40.6 16.3 45 24 45z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.7 5.6C41.6 36 45 30.6 45 24c0-1.4-.1-2.4-.4-3.5z"/>
        </svg>
        Google 계정으로 로그인
      </a>
    </div>
  </div>
  {% endif %}

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
