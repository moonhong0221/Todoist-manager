<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>할 일 관리</h1>

    <form id="task-form" class="task-form">
      <input type="text" id="task-input" placeholder="할 일을 입력하세요" autocomplete="off" required>
      <button type="submit">추가</button>
    </form>

    <div id="filter-bar" class="filter-bar">
      <button type="button" class="filter-btn active" data-filter="all">전체</button>
      <button type="button" class="filter-btn" data-filter="active">진행중</button>
      <button type="button" class="filter-btn" data-filter="done">완료</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <div id="pagination" class="pagination">
      <button type="button" id="prev-page" class="page-btn">이전</button>
      <span id="page-info" class="page-info">1 / 1</span>
      <button type="button" id="next-page" class="page-btn">다음</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
